services:
  database:
    image: postgres:17-alpine
    container_name: extiaDB

    environment:
      POSTGRES_DB: extia_gaming
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    volumes:
      - postgresql_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", "extia_gaming" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

volumes:
  postgresql_data: