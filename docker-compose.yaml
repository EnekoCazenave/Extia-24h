services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    networks:
      - private
    environment:
      POSTGRES_DB: extia_gaming
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    build:
      context: .
      target: migrate
    networks:
      - private
    environment: &database-env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env.docker}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      target: server
    networks:
      - private
    restart: unless-stopped
    init: true
    environment:
      <<: *database-env
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY_HOPS: "1"
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET in .env.docker}
      REFRESH_SECRET: ${REFRESH_SECRET:?Configure REFRESH_SECRET in .env.docker}
      ALLOWED_ORIGINS: ${PUBLIC_SITE_URL:?Configure PUBLIC_SITE_URL in .env.docker}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - uploads:/app/packages/server/uploads
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    build:
      context: .
      target: web
    networks:
      - private
      - public
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Configure SITE_ADDRESS in .env.docker}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  private:
    driver: bridge
    internal: true
  public:
    driver: bridge

volumes:
  postgresql_data:
  uploads:
  caddy_data:
  caddy_config:
